org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# The code references library resources (e.g. R.style.Theme_AppCompat_...)
# through this module's own R class. AGP's newer default (non-transitive R
# classes) hides those and breaks that reference — this restores the old,
# permissive behavior so it resolves without renaming every reference to the
# library's own R class throughout the codebase.
android.nonTransitiveRClass=false
